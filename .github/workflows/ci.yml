name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test contract boundary and property cases
        run: pnpm exec hardhat test test/bridge/NonceBitmap.test.ts test/bridge/BridgeRoute.fuzz.test.ts test/utils/CalldataSlicer.test.ts test/governance/BridgeMultiSigOwnable.test.ts test/governance/BridgeMultiSigOwnable.fuzz.test.ts test/verifiers/MultiSigThresholdUnavailability.production.test.ts

      - name: Test signer policy allowlists and privileged-operation simulation gate
        run: |
          pnpm exec hardhat --config scripts/hardhat.signer-policy.config.ts test
          pnpm exec jest --runInBand --runTestsByPath src/security/simulation/privileged-operation-simulation-gate.spec.ts --moduleFileExtensions ts json js

      - name: Verify bridge escrow conservation specification
        run: pnpm exec jest --runInBand --runTestsByPath scripts/bridge-escrow-conservation.spec.ts

      - name: Verify token adapter risk and reconciliation specification
        run: pnpm exec jest --runInBand --runTestsByPath scripts/token-adapter-risk.spec.ts

      - name: Verify token adapter risk on Hardhat integration suite
        run: pnpm exec hardhat --config scripts/hardhat.token-adapter.config.ts test test/tokens/TokenAdapterRisk.integration.test.ts

      - name: Verify escrow conservation on every supported chain profile
        run: pnpm exec hardhat --config scripts/hardhat.escrow-conservation.config.ts test test/execution/BridgeEscrowConservation.integration.test.ts

      - name: Verify signed production configuration and operational safety models
        run: pnpm exec jest --runInBand --runTestsByPath scripts/production-config-bundle.spec.ts scripts/incident-evidence-export.spec.ts scripts/daily-event-reconciliation-report.spec.ts scripts/delayed-relayer-recovery.spec.ts --moduleFileExtensions ts json js

      - name: Verify operational safety on every supported chain profile
        run: pnpm exec hardhat --config scripts/hardhat.escrow-conservation.config.ts test test/execution/OperationalSafety.integration.test.ts

      - name: Verify production readiness gates
        run: pnpm exec jest --runInBand --runTestsByPath scripts/chain-readiness-gate.spec.ts scripts/route-canary-limits.spec.ts scripts/treasury-address-verification.spec.ts scripts/production-deployment-guard.spec.ts --moduleFileExtensions ts json js

      - name: Verify production readiness gates on every supported chain profile
        run: pnpm exec hardhat --config scripts/hardhat.escrow-conservation.config.ts test test/execution/ProductionReadinessGuards.integration.test.ts

      - name: Lint
        run: pnpm run lint
        working-directory: apps/api
      - name: Verify deployment configuration safety
        run: node --test scripts/check-deployment-config.test.mjs

      - name: Test production-readiness controls
        run: pnpm exec jest --runInBand --runTestsByPath apps/api/src/config/env-schema.spec.ts src/audit/transfers/stellar/audit.service.spec.ts src/reconciliation/reserves/reserve-reconciliation.service.spec.ts scripts/deploy-contracts.spec.ts --moduleFileExtensions ts json js

      - name: Test deployment and incident readiness controls
        run: pnpm exec jest --runInBand --runTestsByPath scripts/deployment-preflight.spec.ts src/config/allowlist/chain-asset-allowlist.service.spec.ts src/audit/transfers/stellar/audit.service.spec.ts --moduleFileExtensions ts json js

      - name: Test production environment loading
        run: pnpm --filter api exec jest --runInBand --moduleFileExtensions ts json js -- config/env-loader.spec.ts

      - name: Build
        run: pnpm run build
        working-directory: apps/api

      - name: Test
        run: pnpm run test
        working-directory: apps/api

      - name: Test e2e
        run: pnpm run test:e2e
        working-directory: apps/api

      - name: Build relayer service
        run: pnpm --filter @bridgewise/relayer-service build

      - name: Test relayer service
        run: pnpm --filter @bridgewise/relayer-service test

      - uses: dtolnay/rust-toolchain@stable

      - name: Test Cargo Rules
        run: cargo test
