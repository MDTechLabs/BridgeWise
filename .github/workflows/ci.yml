name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test controlled canary rollout
        run: pnpm --filter @bridgewise/relayer-service exec jest --runInBand --moduleFileExtensions ts json js -- executors/canary-rollout.spec.ts

      - name: Build
        run: pnpm run build

      - name: Build relayer service
        run: pnpm --filter @bridgewise/relayer-service build

      - uses: dtolnay/rust-toolchain@stable

      - name: Test Cargo Rules
        run: cargo test

