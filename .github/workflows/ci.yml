name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: >-
          pnpm exec jest --runInBand
          src/state-machine/stellar/soroban-transfer-state-machine.spec.ts
          src/recovery/stellar/stellar-bridge-retry.service.spec.ts
          src/detection/rollback/stellar/soroban-rollback-detector.spec.ts
          src/tracking/stellar/soroban-transaction-status-tracker.spec.ts
          src/verification/settlements/stellar/settlement-verifier.service.spec.ts
          test/integration/stellar/soroban-bridge-integration.spec.ts

      - name: Build
        run: pnpm run build

      - uses: dtolnay/rust-toolchain@stable

      - name: Test Cargo Rules
        run: cargo test

